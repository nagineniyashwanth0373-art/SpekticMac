name: Build Spektic macOS (.pkg / .dmg)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Make Postinstall Script Executable
        run: chmod +x build/pkg-scripts/postinstall

      - name: Build macOS Installers (.pkg / .dmg)
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spektic-macOS-Installers
          path: |
            dist/*.pkg
            dist/*.dmg
            dist/*.zip

      - name: Create Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Spektic macOS Installer v1.0.2
          draft: false
          prerelease: false
          files: |
            dist/*.pkg
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
