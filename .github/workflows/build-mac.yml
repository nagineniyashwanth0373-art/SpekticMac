name: Build Spektic macOS (.dmg)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'SpekticMac/package-lock.json'

      - name: Install Dependencies
        run: |
          cd SpekticMac
          npm install

      - name: Build macOS Installer (.dmg)
        run: |
          cd SpekticMac
          npm run build:mac

      - name: Upload .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spektic-macOS-Installer
          path: |
            SpekticMac/dist/*.dmg
            SpekticMac/dist/*.zip
