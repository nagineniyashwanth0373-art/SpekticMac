name: Build Spektic macOS (.dmg)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build macOS Installer (.dmg)
        run: npm run build:mac

      - name: Upload Single Artifact File
        uses: actions/upload-artifact@v4
        with:
          name: Spektic-Mac-Installer
          path: dist/Spektic-1.0.0-arm64.dmg

      - name: Create Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Spektic macOS Installer v1.0.0
          draft: false
          prerelease: false
          files: |
            dist/Spektic-1.0.0-arm64.dmg
            dist/Spektic-1.0.0.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
